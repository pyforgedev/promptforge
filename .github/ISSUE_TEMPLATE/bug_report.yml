name: Bug Report
description: Report a bug or unexpected behavior in PromptForge
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please search existing issues first to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: App version
      description: Version shown in the footer or package.json (e.g. 0.4.0)
      placeholder: "0.4.0"
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: Where does the bug happen?
      multiple: true
      options:
        - Home
        - Generator
        - History
        - Templates
        - Formatter
        - Settings
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "When I generate 10 prompts with aspect ratio 16:9, only 3 appear..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Go to /generator
        2. Select ...
        3. Click Generate
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and device you used.
      placeholder: "Chrome 130 / macOS 15 / Desktop"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, console errors, or anything else that helps.
